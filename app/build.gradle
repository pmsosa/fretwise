plugins {
    id 'com.android.application'
}

android {
    namespace 'app.guitarlele.tuner'
    compileSdk 35

    defaultConfig {
        applicationId 'app.guitarlele.tuner'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
