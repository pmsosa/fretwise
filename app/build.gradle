plugins {
    id 'com.android.application'
}

// One fixed key for every build, so a new APK installs over the old one.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('signing/guitarlele.jks')
def propsFile = rootProject.file('signing/keystore.properties')
if (propsFile.exists()) propsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'app.guitarlele.tuner'
    compileSdk 35

    defaultConfig {
        applicationId 'app.guitarlele.tuner'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        if (keystoreFile.exists() && propsFile.exists()) {
            stable {
                storeFile keystoreFile
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            if (signingConfigs.findByName('stable')) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            if (signingConfigs.findByName('stable')) signingConfig signingConfigs.stable
        }
    }
}
